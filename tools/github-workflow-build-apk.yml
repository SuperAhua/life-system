name: build-apk

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'www/**'
      - '生命系统.html'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'tools/build.mjs'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 安装依赖
        run: npm ci

      - name: 生成 www（含内嵌说明）
        run: node tools/build.mjs

      - name: 同步原生工程
        run: npx cap sync android

      - name: 构建 Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 整理产物
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk life-system.apk
          ls -lh life-system.apk

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: life-system-apk
          path: life-system.apk
          retention-days: 30

      - name: 发布到 Release（手机直接下载）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest life-system.apk \
            --title "生命系统 · 最新安卓包" \
            --notes "构建号 ${{ github.run_number}} · 提交 ${GITHUB_SHA:0:7}。下载 life-system.apk 后直接安装。"
